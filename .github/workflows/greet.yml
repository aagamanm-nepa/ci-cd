name: greet-message

on:
  push:
    branches: [main]

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to VPS
        env:
          SERVER_HOST: ${{ secrets.HOST_NAME }}
          SERVER_USER: ${{ secrets.HOST_USER }}
          SERVER_PORT: ${{ secrets.HOST_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SSH_KEY }}
          # Optional: paste `ssh-keyscan <host>` output into this secret to pin the host key
          SERVER_KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: python .github/scripts/connect_vps.py